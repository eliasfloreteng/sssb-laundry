name: Android release

# The Android half of what Xcode Cloud does for iOS: a version tag is built, signed with
# the upload key and rolled out to Play's closed testing track ("Closed testing - Alpha"),
# whose testers get it as an update.
#
# Play then turns the bundle into a universal APK signed with the app signing key, and
# that APK goes on the tag's GitHub release as sssb-laundry.apk, which /android/download
# on the server points at. Being Play-signed, an installed APK and the Play build update
# one another.
#
# bump-build.yml cuts those tags and calls this workflow itself, because a tag pushed
# with the workflow's own token never starts another workflow. A tag pushed by hand
# starts it through `push`. Run it by hand on a tag to retry a failed upload, or as a
# dry run to build and check the Play credentials without uploading anything.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        description: The tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the Play credentials, but upload nothing
        type: boolean
        default: false

permissions:
  # Attaching the APK to the release.
  contents: write

concurrency:
  group: android-release

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The same layout as a local checkout, so build.gradle.kts signs with the
      # upload key exactly as it does on a Mac.
      - name: Restore the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p secrets
          echo "$KEYSTORE" | base64 --decode > secrets/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > secrets/upload.properties

      - name: Build the bundle
        run: ./gradlew :app:bundleRelease

      - name: Summarize
        id: version
        run: |
          set -euo pipefail
          code=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          name=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "Built $name ($code) from \`${{ inputs.ref || github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Check the Play credentials
        if: inputs.dry_run
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/play.json"
          printf '%s' "$SUPPLY_JSON_KEY_DATA" > "$key"
          fastlane run validate_play_store_json_key json_key:"$key"
          rm "$key"

      # Only the bundle and its release notes go up: changelogs/<versionCode>.txt in
      # each language, else changelogs/default.txt. The listing itself is edited in
      # Play Console.
      - name: Roll out to closed testing
        if: ${{ !inputs.dry_run }}
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          fastlane supply \
            --package_name se.floreteng.sssblaundry \
            --track alpha \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --metadata_path fastlane/metadata/android \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_apk true

      # Generated as the bundle is committed to the track, so it is normally there at
      # once; the retries cover a slow one. A dry run fetches the APK of the version on
      # the checked-out ref, which Play already has, as a check of the same permissions.
      - name: Fetch the universal APK from Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/play.json"
          printf '%s' "$SUPPLY_JSON_KEY_DATA" > "$key"
          trap 'rm -f "$key"' EXIT
          for attempt in 1 2 3 4 5; do
            if fastlane run download_universal_apk_from_google_play \
                package_name:se.floreteng.sssblaundry \
                version_code:"$VERSION_CODE" \
                json_key:"$key" \
                destination:"$RUNNER_TEMP/sssb-laundry.apk"; then
              break
            fi
            [ "$attempt" = 5 ] && exit 1
            sleep 60
          done
          unzip -l "$RUNNER_TEMP/sssb-laundry.apk" AndroidManifest.xml > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: sssb-laundry.apk
          path: ${{ runner.temp }}/sssb-laundry.apk

      # bump-build.yml creates the release before calling this; a tag pushed by hand
      # has none yet, so it gets one here.
      - name: Attach the APK to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$NAME ($CODE)" \
              --notes "Build $CODE of $NAME."
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/sssb-laundry.apk" --clobber
