# Deploy entrypoint for the API half of the repo. It sits at the root because the
# server checks this repo out as the stack directory, and both Dockge and a plain
# `docker compose up` look for the compose file there. The build context is ./api,
# so api/.dockerignore is what applies. The project name comes from the directory.

services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    # tini as PID 1 — bun doesn't reap the healthcheck processes the image spawns.
    init: true
    ports:
      # A plain local deploy; the deployment's compose.override.yaml unpublishes
      # this and routes through Traefik instead.
      - "3000:3000"
    environment:
      - "LOG_LEVEL=debug"
      - "DB_PATH=/data/laundry.db"
      - "PUSH_ENABLED=true"
    env_file:
      # APNS_KEY_ID, APNS_TEAM_ID, APNS_TOPIC and APNS_KEY_P8, plus
      # UPSTREAM_CHECK_OBJECT_ID — an object id is a credential, so it lives here
      # rather than above. Untracked: this repo is public. Absent on checkouts that
      # don't send push, and then the server logs one warning and runs without
      # notifications; without the object id it also stops probing upstream.
      - path: .env
        required: false
    volumes:
      # Device tokens and queued reminders must survive a redeploy. The container
      # runs as uid 1000 (`bun`), so the host directory has to be writable by it:
      # `mkdir -p data && sudo chown 1000:1000 data` before the first up.
      - ./data:/data
